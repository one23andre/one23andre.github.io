    title: "About Me"
    image: "/images/hero.jpeg"
    content: |-
      I am Jimmy Andre Ageng'o — a dual-discipline technologist completing a Bachelor of Technology in Mechanical Engineering (Manufacturing) at the Technical University of Kenya and a Cybersecurity program at Moringa School, Nairobi.
 
      My background spans two worlds that are increasingly converging: physical systems and digital security. I have hands-on experience conducting penetration tests, building security automation tools in Python, triaging SOC alerts, and operating CNC machines and lathes in industrial workshops. I bring an engineer's systematic thinking to cybersecurity — methodical, precise, and focused on root causes rather than symptoms.
 
      I am actively pursuing roles in cybersecurity analysis, penetration testing, and industrial/OT security — where my engineering foundation gives me a genuine edge over purely IT-focused candidates.
    skills:
      enable: true
      title: "Core technical skills:"
      items:
